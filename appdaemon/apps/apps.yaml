pellet_level:
  module: pellet_level
  class: PelletLevel

  camera_entity: camera.pellet_snapshot

  # HA Core writes here (must be /config/... and allowlisted)
  ha_snapshot_path: /config/www/snapshots/pellet_raw.jpg

  # AppDaemon reads/writes here (inside AppDaemon add-on)
  raw_path: /homeassistant/www/snapshots/pellet_raw.jpg
  # Optional: save mask for visual verification (comment out to disable)
  mask_output_path: /homeassistant/www/snapshots/pellet_mask.png
  debug_snapshot_path: /homeassistant/www/snapshots/pellet_debug.jpg
  debug_line_thickness: 2

  # Your tuned ROI
  rotate_deg: 0
  crop_left_px: 570 #650
  crop_top_px: 200 # 530
  crop_width_px: 50 # 50
  crop_height_px: 370 # 300

  # Turn off the auto steps
  threshold_mode: fixed
  threshold: 170          # pick your constant split (0–255)

  # Lock the grayscale mapping: anything at/below this becomes 0, at/above becomes 255
  fixed_black_level: 40   # input gray you consider “black”
  fixed_white_level: 200  # input gray you consider “white”
  gamma: 1.0              # optional gamma after mapping (e.g., 0.9–1.2)

  # Thresholding (omit to let Otsu pick automatically)
  # threshold: 165
  median_radius: 1

  # Level-line detection
  min_run_px: 15 # contiguous white pixels needed in a row
  min_run_rows: 3 # must hold for this many consecutive rows
  
  # OPTIONAL smoothing & spike handling
  ema_alpha: 0.25                 # 0..1 (lower = slower). EMA smoothing on sacks.
  max_delta_sacks_per_min: 1.0    # clamp per-minute change; e.g. 1.0 sack/min
  brightness_hold_threshold: 25   # 0..255 mean-luma jump to treat as lighting spike

  # OPTIONAL bypass (when filling pellets etc.). If omitted, bypass is off.
  bypass_entity: input_boolean.pellets_filling
  
  # Main sensor
  sensor_entity: sensor.pellet_level

  # Calibration: raw fraction (0..1) -> sacks (0..12)
  filter:
    - calibrate_linear:
        - 0.2  -> 0 #M
        - 0.44 -> 1
        - 0.497 -> 2 #M
        - 0.51 -> 2.5 #M
        - 0.535 -> 3.5 #M
        - 0.647 -> 6 #M
        - 0.792 -> 8.5 #M
        - 0.891 -> 9.5
        - 0.915 -> 12 #M

  interval_seconds: 30 #300
  process_delay_sec: 5
  process_wait_sec: 10
