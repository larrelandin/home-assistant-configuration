template:
  - sensor:
      - name: "Nuvarande toppström inkommande faser huvudsäkringar ofiltrerat"
        unique_id: 3b4b7da7-ee15-44b9-a085-5caf25731ec5
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.current_phase_1'))
            and is_number(states('sensor.current_phase_2'))
            and is_number(states('sensor.current_phase_3')) }}
        state: >
          {{
            [
              states('sensor.current_phase_1') | float,
              states('sensor.current_phase_2') | float,
              states('sensor.current_phase_3') | float
            ] | max | round(1)
          }}

      - name: "Effekt elmätare"
        unique_id: 214a30a7-a59d-4a55-8833-4196137c1677
        unit_of_measurement: "W"
        state: "{{ ((states('sensor.power_produced')|float(0) - states('sensor.power_consumed')|float(0)) * 1000) | round(0)}}"

      - name: "Nuvarande toppström inkommande faser huvudsäkringar"
        unique_id: energy_momentary_max_phase_current_main_fuses
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        availability: >
          {{ is_number(states(
              'sensor.nuvarande_toppstrom_inkommande_faser_huvudsakringar_ofiltrerat'
            ))
            and is_number(states(
              'sensor.toppstrom_huvudsakringar_langsam'
            )) }}
        state: >
          {% set current =
            states(
              'sensor.nuvarande_toppstrom_inkommande_faser_huvudsakringar_ofiltrerat'
            ) | float
          %}
          {% set slow =
            states('sensor.toppstrom_huvudsakringar_langsam') | float
          %}
          {{ [current, slow] | max | round(1) }}

      - name: "Nuvarande elpris"
        unique_id: 141ad27f-258b-4b40-a430-a8737744ab68
        state_class: measurement
        unit_of_measurement: "öre/kWh"
        availability: >
          {{ states('sensor.nordpool_spotpris') | is_number }}
        state: >
          {% set spot_ex_vat = states('sensor.nordpool_spotpris') | float %}
          {% set spot_incl_vat = spot_ex_vat * 1.25 %}
          {% set tibber_markup = 7.5 %}
          {% set tibber_variable = 4.1 %}
          {% set kraftringen_transfer = 20 + (0.05 * spot_incl_vat) %}
          {% set energy_tax = 45 %}
          {{
            (
              spot_incl_vat
              + tibber_markup
              + tibber_variable
              + kraftringen_transfer
              + energy_tax
            ) | round(2)
          }}

        attributes:
          nordpool_exkl_moms: >
            {{ states('sensor.nordpool_spotpris') | float(0) | round(2) }}

          nordpool_inkl_moms: >
            {{ (states('sensor.nordpool_spotpris') | float(0) * 1.25) | round(2) }}

          tibber_markup: >
            {{ 7.5 }}

          tibber_variable_cost: >
            {{ 4.1 }}

          kraftringen_transfer: >
            {% set spot_incl_vat =
              states('sensor.nordpool_spotpris') | float(0) * 1.25 %}
            {{ (20 + (0.05 * spot_incl_vat)) | round(2) }}

          energy_tax: >
            {{ 45 }}

          fixed_monthly_fees_included: >
            {{ false }}

          raw_today: >
            {% set source =
              state_attr('sensor.nordpool_spotpris', 'raw_today') or [] %}
            {% set ns = namespace(result=[]) %}
            {% for entry in source %}
              {% set spot_ex_vat = entry.value | float %}
              {% set spot_incl_vat = spot_ex_vat * 1.25 %}
              {% set total =
                spot_incl_vat
                + 7.5
                + 4.1
                + 20
                + (0.05 * spot_incl_vat)
                + 45
              %}
              {% set ns.result = ns.result + [
                {
                  "start": entry.start.isoformat(),
                  "value": total | round(2)
                }
              ] %}
            {% endfor %}
            {{ ns.result }}

          raw_tomorrow: >
            {% set source =
              state_attr('sensor.nordpool_spotpris', 'raw_tomorrow') or [] %}
            {% set ns = namespace(result=[]) %}
            {% for entry in source %}
              {% set spot_ex_vat = entry.value | float %}
              {% set spot_incl_vat = spot_ex_vat * 1.25 %}
              {% set total =
                spot_incl_vat
                + 7.5
                + 4.1
                + 20
                + (0.05 * spot_incl_vat)
                + 45
              %}
              {% set ns.result = ns.result + [
                {
                  "start": entry.start.isoformat(),
                  "value": total | round(2)
                }
              ] %}
            {% endfor %}
            {{ ns.result }}

      - name: "Nuvarande elpris försäljning"
        unique_id: 1aaadb72-228e-4b88-93bc-ea26d73a38ad
        state_class: measurement
        unit_of_measurement: "öre/kWh"
        availability: >
          {{ states('sensor.nordpool_spotpris') | is_number }}
        state: >
          {% set spot_ex_vat = states('sensor.nordpool_spotpris') | float %}
          {% set kraftringen_natnytta = 6.6 + (0.05 * spot_ex_vat) %}
          {{ (spot_ex_vat + kraftringen_natnytta) | round(2) }}

        attributes:
          tibber_ersattning: >
            {{ states('sensor.nordpool_spotpris') | float(0) | round(2) }}

          kraftringen_natnytta: >
            {% set spot_ex_vat =
              states('sensor.nordpool_spotpris') | float(0) %}
            {{ (6.6 + (0.05 * spot_ex_vat)) | round(2) }}

          energy_tax: >
            {{ 0 }}

          tax_reduction: >
            {{ 0 }}

          vat_included: >
            {{ false }}

          raw_today: >
            {% set source =
              state_attr('sensor.nordpool_spotpris', 'raw_today') or [] %}
            {% set ns = namespace(result=[]) %}
            {% for entry in source %}
              {% set spot_ex_vat = entry.value | float %}
              {% set total =
                spot_ex_vat
                + 6.6
                + (0.05 * spot_ex_vat)
              %}
              {% set ns.result = ns.result + [
                {
                  "start": entry.start.isoformat(),
                  "value": total | round(2)
                }
              ] %}
            {% endfor %}
            {{ ns.result }}

          raw_tomorrow: >
            {% set source =
              state_attr('sensor.nordpool_spotpris', 'raw_tomorrow') or [] %}
            {% set ns = namespace(result=[]) %}
            {% for entry in source %}
              {% set spot_ex_vat = entry.value | float %}
              {% set total =
                spot_ex_vat
                + 6.6
                + (0.05 * spot_ex_vat)
              %}
              {% set ns.result = ns.result + [
                {
                  "start": entry.start.isoformat(),
                  "value": total | round(2)
                }
              ] %}
            {% endfor %}
            {{ ns.result }}

sensor:
  - platform: filter
    name: "Toppström huvudsäkringar långsam"
    entity_id: sensor.nuvarande_toppstrom_inkommande_faser_huvudsakringar_ofiltrerat
    filters:
      - filter: lowpass
        time_constant: 10
        precision: 1

utility_meter:
  energy_consumption_hourly:
    name: Elkonsumtion per timme
    source: sensor.energy_consumed_luxembourg
    cycle: hourly
