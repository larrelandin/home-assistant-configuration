template:
  - sensor:
      - name: "ow_pool_temp_rounded"
        unique_id: ow_pool_temp_rounded
        device_class: temperature
        unit_of_measurement: "°C"
        state: "{{ states('sensor.ow_pool_temp_smoothed') | float | round(0) }}"

sensor:
  - platform: filter
    name: "ow_pool_temp_smoothed"
    entity_id: sensor.ow_pool_temp
    filters:
      - filter: lowpass
        time_constant: 30
        precision: 1
      - filter: time_simple_moving_average
        window_size: "00:10"
        precision: 1

  - platform: daily_min_max
    name: Dygnets lägsta utetemperatur
    unique_id: 34956152-c233-47f7-98a4-42134647e7fe
    type: min
    entity_ids:
      - sensor.ow_outside_temp
  - platform: daily_min_max
    name: Dygnets högsta utetemperatur
    unique_id: 1a464096-fd9b-495f-8ac9-55c8d481504a
    type: max
    time: "03:30:00"
    entity_ids:
      - sensor.ow_outside_temp
  - platform: statistics
    name: temperature_mean_last_month
    unique_id: 25915f3a-58d5-4bd3-bca6-bb1bc2268dd9
    entity_id: sensor.ow_outside_temp
    state_characteristic: mean
    max_age:
      days: 30

rest:
  resource: "http://192.168.10.31/details.xml"
  scan_interval: 60
  sensor:
    # 1-wire huvudnod
    - name: "1 wire EDS"
      unique_id: "owserver"
      value_template: "{{ value_json['Devices-Detail-Response']['HostName'] }}"
      force_update: true
      json_attributes_path: "$.['Devices-Detail-Response']"
      json_attributes:
        - MACAddress
        - DeviceName
        - VoltagePower
        - DateTime
        - LoopTime
        - PollCount
        - DevicesConnected
        - DevicesConnectedChannel1
        - DevicesConnectedChannel2
        - DevicesConnectedChannel3
        - VoltageChannel1
        - VoltageChannel2
        - VoltageChannel3
        - DataErrorsChannel1
        - DataErrorsChannel2
        - DataErrorsChannel3
        - owd_DS18S20
        - owd_DS18B20

    - name: "ow_kitchen_temp"
      unique_id: owserver.ow_kitchen_temp
      value_template: >
        {% set sensor = (value_json['Devices-Detail-Response']['owd_DS18S20'] | selectattr('ROMId','==','0B0008027C035E10') | list | first) %}
        {% if sensor['Health'] | int >= 7 %}
          {{ sensor['Temperature']['#text'] | round(1) }}
        {% else %} unavailable {% endif %}
      device_class: temperature
      unit_of_measurement: "°C"
      force_update: true
      json_attributes:
        - ROMId
        - Channel

    - name: "ow_kitchen_health"
      unique_id: owserver.ow_kitchen_health
      value_template: >
        {% set sensor = (value_json['Devices-Detail-Response']['owd_DS18S20'] | selectattr('ROMId','==','0B0008027C035E10') | list | first) %}
        {{ sensor['Health'] | int if sensor is defined else 0 }}
      force_update: true
      icon: mdi:heart-pulse

    # ow_pool_temp + health
    - name: "ow_pool_temp"
