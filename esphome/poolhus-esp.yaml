substitutions:
  static_ip: 192.168.10.61

esphome:
  name: poolhus-esp
  comment: $static_ip

esp8266:
  board: nodemcuv2

wifi:
  ssid: 'landin iot'
  password: !secret landin_iot_wifi_password
  domain: '.landin.lan'
  fast_connect: true
  min_auth_mode: WPA2
  
  manual_ip:
    static_ip: $static_ip
    gateway: 192.168.10.1
    subnet: 255.255.255.0

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "w3flBXtasyAihrls4KykA7qFl5ozJrXsX5y6w84tAR8="

ota:
  - platform: esphome
    password: !secret esp_ota_password

binary_sensor:
  - platform: status
    name: "Poolhus ESP status"

# DHT11
sensor:
  - platform: dht
    model: DHT11
    pin: D4
    temperature:
      name: "Temperatur poolhus"
      unit_of_measurement: "°C"
    humidity:
      name: "Fukt poolhus"
      icon: "mdi:water-percent"
      unit_of_measurement: "%"
    update_interval: 60s

switch:
  - platform: restart
    name: "Poolhus ESP restart"