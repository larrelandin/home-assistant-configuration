# Note that this integration is dependent on the remote_homeassistant integration as the sensors are coming from that remote HA instance

template:
  - sensor:
      - name: "Solarpanels production"
        unit_of_measurement: "kWh"
        state_class: total_increasing
        device_class: energy
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.inverter_total_yield') | is_number }}
        state: >
          {{ states('sensor.inverter_total_yield') | float | round(3) }}
        attributes:
          last_reset: "1970-01-01T00:00:00+00:00"

  - sensor:
      - name: "pv_string_02_power"
        unit_of_measurement: "kW"
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.inverter_pv_2_voltage') | is_number
            and states('sensor.inverter_pv_2_current') | is_number }}
        state: >
          {{ (states('sensor.inverter_pv_2_voltage') | float
              * states('sensor.inverter_pv_2_current') | float
              / 1000) | round(2) }}

  - sensor:
      - name: "pv_string_01_power"
        unit_of_measurement: "kW"
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.inverter_pv_1_voltage') | is_number
            and states('sensor.inverter_pv_1_current') | is_number }}
        state: >
          {{ (states('sensor.inverter_pv_1_voltage') | float
              * states('sensor.inverter_pv_1_current') | float
              / 1000) | round(2) }}

utility_meter:
  daily_production_pv1:
    name: Daglig elproduktion PV1
    source: sensor.pv_string_01_power
    cycle: daily
  daily_production_pv2:
    name: Daglig elproduktion PV2
    source: sensor.pv_string_02_power
    cycle: daily
